name: MacOSAppStarter
options:
  bundleIdPrefix: dev.xueshi
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
  knownRegions:
    - en
    - zh-Hans
    - Base

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    DEVELOPMENT_LANGUAGE: en
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: YES

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.0"
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: "2.2.0"
  Aptabase:
    url: https://github.com/aptabase/aptabase-swift
    from: "0.3.0"

targets:
  MacOSAppStarter:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: MacOSAppStarter/Sources
      - path: MacOSAppStarter/Assets.xcassets
      - path: MacOSAppStarter/Resources
    info:
      path: MacOSAppStarter/Resources/Info.plist
      properties:
        CFBundleDisplayName: MacOSAppStarter
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.developer-tools
        LSUIElement: false
        NSHumanReadableCopyright: "Copyright © 2026 Xueshi Qiao. All rights reserved."
        NSAppleEventsUsageDescription: "MacOSAppStarter needs Apple Events to demonstrate Accessibility integration."
        # --- Sparkle ---
        # SUFeedURL: appcast.xml is committed to the repo root on `main` and
        # served via GitHub's raw URL. CI generates and commits the appcast on
        # every tagged release. This matches the pattern used by AnyDrag,
        # PastePawX, HyperCapsLock, etc.
        # When forking, change XueshiQiao/macos-app-starter to <your-owner>/<your-repo>.
        # Until the first release ships, this URL returns 404 — Sparkle will
        # report a network error on Check for Updates, which is expected.
        SUFeedURL: "https://raw.githubusercontent.com/XueshiQiao/macos-app-starter/main/appcast.xml"
        # SUPublicEDKey: the public half of the ed25519 key pair generated with
        # Sparkle's `generate_keys` tool. The matching private key is stored as
        # the GitHub repo secret SPARKLE_ED_PRIVATE_KEY (used by CI's sign_update
        # step). When forking, generate your own pair and replace this value:
        #   ./bin/generate_keys --account <your-app-name>
        #   ./bin/generate_keys --account <your-app-name> -x ./private.key
        #   gh secret set SPARKLE_ED_PRIVATE_KEY --repo <owner>/<repo> < ./private.key
        #   rm ./private.key
        SUPublicEDKey: "dAF9J6eNXJsoSh3L62SZKcpyzHlS4YitByOWqEgiRZM="
        SUEnableAutomaticChecks: true
        # APTABASE_KEY: events flow to https://app.aptabase.com under this key.
        # When forking, replace with your own (free at aptabase.com) — otherwise
        # your usage events go to the original maintainer's dashboard.
        # Empty string disables the Analytics wrapper entirely.
        APTABASE_KEY: "A-US-3800930688"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.xueshi.macos-app-starter
        PRODUCT_NAME: MacOSAppStarter
        CODE_SIGN_ENTITLEMENTS: MacOSAppStarter/Resources/MacOSAppStarter.entitlements
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - package: Sparkle
      - package: KeyboardShortcuts
      - package: Aptabase

  MacOSAppStarterTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: MacOSAppStarterTests
    dependencies:
      - target: MacOSAppStarter
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.xueshi.macos-app-starter.tests
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/MacOSAppStarter.app/Contents/MacOS/MacOSAppStarter"

schemes:
  MacOSAppStarter:
    build:
      targets:
        MacOSAppStarter: all
        MacOSAppStarterTests: [test]
    test:
      targets:
        - MacOSAppStarterTests
