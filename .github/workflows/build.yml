name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  APP_NAME: MacOSAppStarter
  SCHEME: MacOSAppStarter

permissions:
  contents: write   # required so the cask-bump step can push appcast.xml back to main

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Detect Apple Developer secrets
        id: detect
        run: |
          if [[ -n "${{ secrets.MAC_CERTS_P12_BASE64 }}" && -n "${{ secrets.APPLE_ID }}" ]]; then
            echo "HAS_APPLE_SECRETS=true" >> $GITHUB_ENV
          else
            echo "HAS_APPLE_SECRETS=false" >> $GITHUB_ENV
          fi

      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install dependencies
        run: brew install xcodegen create-dmg

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build universal binary (unsigned)
        if: env.HAS_APPLE_SECRETS == 'false'
        run: |
          xcodebuild -project $APP_NAME.xcodeproj \
            -scheme $SCHEME \
            -configuration Release \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build \
            SYMROOT=$(pwd)/build

      - name: Run unit tests
        run: |
          xcodebuild -project $APP_NAME.xcodeproj \
            -scheme $SCHEME \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            test

      # ---- Apple Developer Account required below ----

      - name: Import signing certificate
        if: env.HAS_APPLE_SECRETS == 'true'
        env:
          P12_BASE64: ${{ secrets.MAC_CERTS_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MAC_CERTS_P12_PASSWORD }}
        run: |
          if [[ -z "$P12_BASE64" || -z "$P12_PASSWORD" ]]; then
            echo "::error::MAC_CERTS_P12_BASE64 and MAC_CERTS_P12_PASSWORD must both be set."
            exit 1
          fi

          CERT_PATH="$RUNNER_TEMP/signing-cert.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)

          echo "$P12_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          rm -f "$CERT_PATH"

      - name: Build signed
        if: env.HAS_APPLE_SECRETS == 'true'
        env:
          SIGNING_IDENTITY: ${{ secrets.SIGNING_IDENTITY || 'Developer ID Application' }}
        run: |
          xcodebuild -project $APP_NAME.xcodeproj \
            -scheme $SCHEME \
            -configuration Release \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="$SIGNING_IDENTITY" \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES \
            build \
            SYMROOT=$(pwd)/build

          APP_PATH="build/Release/$APP_NAME.app"
          ENTITLEMENTS="MacOSAppStarter/Resources/MacOSAppStarter.entitlements"

          # Inside-out signing of embedded code (Sparkle XPC services etc.)
          if [ -d "$APP_PATH/Contents/Frameworks" ]; then
            find "$APP_PATH/Contents/Frameworks" -type f | while read -r f; do
              if file "$f" | grep -q "Mach-O"; then
                codesign --force --options runtime --timestamp \
                  --sign "$SIGNING_IDENTITY" "$f"
              fi
            done
            find "$APP_PATH/Contents/Frameworks" -name "*.xpc" -type d | while read -r b; do
              codesign --force --options runtime --timestamp \
                --sign "$SIGNING_IDENTITY" "$b"
            done
            find "$APP_PATH/Contents/Frameworks" -name "*.app" -type d | while read -r b; do
              codesign --force --options runtime --timestamp \
                --sign "$SIGNING_IDENTITY" "$b"
            done
            find "$APP_PATH/Contents/Frameworks" \( -name "*.framework" -o -name "*.dylib" \) | while read -r b; do
              codesign --force --options runtime --timestamp \
                --sign "$SIGNING_IDENTITY" "$b"
            done
          fi

          codesign --force --options runtime --timestamp \
            --entitlements "$ENTITLEMENTS" \
            --sign "$SIGNING_IDENTITY" "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

      - name: Notarize app
        if: env.HAS_APPLE_SECRETS == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_PASSWORD: ${{ secrets.APP_SPECIFIC_PASSWORD }}
        run: |
          if [[ -z "$APPLE_ID" || -z "$APP_PASSWORD" || -z "$TEAM_ID" ]]; then
            echo "::error::Missing notarization secrets."
            exit 1
          fi
          ditto -c -k --keepParent "build/Release/$APP_NAME.app" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --apple-id "$APPLE_ID" --team-id "$TEAM_ID" --password "$APP_PASSWORD" --wait
          xcrun stapler staple "build/Release/$APP_NAME.app"
          rm -f "$RUNNER_TEMP/notarize.zip"

      - name: Create DMG
        if: env.HAS_APPLE_SECRETS == 'true'
        run: |
          create-dmg \
            --volname "$APP_NAME" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "$APP_NAME.app" 150 190 \
            --hide-extension "$APP_NAME.app" \
            --app-drop-link 450 190 \
            "$APP_NAME.dmg" \
            "build/Release/$APP_NAME.app" || true

      # Sparkle appcast generation + commit. Runs only on tag pushes. The
      # appcast lives at the repo root on `main` and is served via
      # https://raw.githubusercontent.com/<owner>/<repo>/main/appcast.xml
      # (matches AnyDrag/PastePawX/HyperCapsLock setup). The job:
      #   1. Downloads Sparkle's sign_update tool
      #   2. Signs the DMG to produce sparkle:edSignature
      #   3. Generates appcast.xml referencing the about-to-be-published release
      #   4. Commits + pushes appcast.xml back to main with [skip ci]
      - name: Download Sparkle tools
        if: env.HAS_APPLE_SECRETS == 'true' && startsWith(github.ref, 'refs/tags/v')
        run: |
          SPARKLE_VERSION="2.6.4"
          curl -sL -o "$RUNNER_TEMP/sparkle.tar.xz" \
            "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz"
          mkdir -p "$RUNNER_TEMP/sparkle"
          tar -xf "$RUNNER_TEMP/sparkle.tar.xz" -C "$RUNNER_TEMP/sparkle"

      - name: Sign DMG and generate appcast
        if: env.HAS_APPLE_SECRETS == 'true' && startsWith(github.ref, 'refs/tags/v')
        env:
          SPARKLE_EDDSA_KEY: ${{ secrets.SPARKLE_EDDSA_KEY }}
        run: |
          if [[ -z "$SPARKLE_EDDSA_KEY" ]]; then
            echo "::warning::SPARKLE_EDDSA_KEY not set — release will go out without an appcast."
            exit 0
          fi

          KEY_FILE="$RUNNER_TEMP/sparkle_eddsa.key"
          echo -n "$SPARKLE_EDDSA_KEY" > "$KEY_FILE"
          SIGN_OUTPUT=$("$RUNNER_TEMP/sparkle/bin/sign_update" "$APP_NAME.dmg" -f "$KEY_FILE")
          rm -f "$KEY_FILE"

          ED_SIGNATURE=$(echo "$SIGN_OUTPUT" | sed -n 's/.*sparkle:edSignature="\([^"]*\)".*/\1/p')
          VERSION=$(grep MARKETING_VERSION project.yml | head -1 | awk -F'"' '{print $2}')
          BUILD=$(grep CURRENT_PROJECT_VERSION project.yml | head -1 | awk -F'"' '{print $2}')
          FILE_LENGTH=$(stat -f%z "$APP_NAME.dmg")
          TAG="${GITHUB_REF_NAME}"
          DOWNLOAD_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${APP_NAME}.dmg"
          PUB_DATE=$(date -u "+%a, %d %b %Y %H:%M:%S +0000")

          {
            echo '<?xml version="1.0" encoding="utf-8"?>'
            echo '<rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">'
            echo '  <channel>'
            echo "    <title>${APP_NAME} Updates</title>"
            echo "    <link>https://github.com/${GITHUB_REPOSITORY}</link>"
            echo "    <description>Most recent updates to ${APP_NAME}</description>"
            echo "    <language>en</language>"
            echo '    <item>'
            echo "      <title>Version ${VERSION}</title>"
            echo "      <pubDate>${PUB_DATE}</pubDate>"
            echo "      <sparkle:version>${BUILD}</sparkle:version>"
            echo "      <sparkle:shortVersionString>${VERSION}</sparkle:shortVersionString>"
            echo "      <sparkle:minimumSystemVersion>14.0</sparkle:minimumSystemVersion>"
            echo "      <enclosure url=\"${DOWNLOAD_URL}\" length=\"${FILE_LENGTH}\" type=\"application/octet-stream\" sparkle:edSignature=\"${ED_SIGNATURE}\" />"
            echo '    </item>'
            echo '  </channel>'
            echo '</rss>'
          } > appcast.xml

      - name: Commit appcast.xml to main
        if: env.HAS_APPLE_SECRETS == 'true' && startsWith(github.ref, 'refs/tags/v')
        run: |
          if [[ ! -f appcast.xml ]]; then
            echo "appcast.xml was not generated (likely SPARKLE_EDDSA_KEY missing) — skipping commit."
            exit 0
          fi
          git fetch origin main
          git checkout -B main origin/main
          # Re-place the freshly generated appcast over whatever is on main
          mv appcast.xml /tmp/appcast.xml
          cp /tmp/appcast.xml appcast.xml
          if git diff --quiet appcast.xml; then
            echo "appcast.xml unchanged."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Update appcast.xml for ${GITHUB_REF_NAME} [skip ci]" appcast.xml
          git push origin main

      - name: Upload artifact
        if: env.HAS_APPLE_SECRETS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-dmg
          path: ${{ env.APP_NAME }}.dmg

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && env.HAS_APPLE_SECRETS == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APP_NAME }}.dmg
          generate_release_notes: true
